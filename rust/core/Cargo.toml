[package]
name = "securibit-core"
version = "0.1.0"
edition = "2021"
description = "Securibit 的安全核心：TOTP、Base32、otpauth、加密群組（enc:v1）、App 鎖定雜湊、記憶體裡的金鑰保管"
publish = false

[lib]
name = "securibit_core"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
url = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
