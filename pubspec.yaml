name: securibit
description: "Securibit 兩步驟驗證器（iOS、Android、macOS、Linux），後端與網站共用 Supabase。"
publish_to: 'none'

version: 1.3.1+5

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  app_links: ^6.4.0
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  http: ^1.2.0
  # 檢查下載的更新檔（SHA-256）；本來就是 http、supabase 的相依套件，沒有多帶新的程式碼
  crypto: ^3.0.6
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  mobile_scanner: ^7.0.0
  local_auth: ^2.3.0
  google_sign_in: ^7.2.0
  securibit_api:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  qr_flutter: ^4.1.0
  file_picker: ^11.0.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/bityo.png
