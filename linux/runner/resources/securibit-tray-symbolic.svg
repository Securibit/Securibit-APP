<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="142 148 740 740">
  <!--
    Securibit 系統匣圖示：盾牌加驗證碼倒數圓餅（同 App 圖示），單色。
    名稱以 -symbolic 結尾，GNOME 會依面板的文字顏色重新上色；KDE 依 ColorScheme-Text 換成配色的文字顏色；
    其他桌面用預設的 #bebebe（symbolic 圖示慣用的灰）。
    只用一條 evenodd 路徑，因為 KDE 的 QtSvg 不支援 mask。
  -->
  <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color: #bebebe; }</style>
