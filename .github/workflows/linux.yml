# Linux 版在 GitHub 的 Linux 主機上直接建置（不用 Docker）：x64 與 arm64 各一台，產出 .tar.gz、.deb、AppImage。
# 手動執行（Actions → Linux → Run workflow），或 push v* 標籤時建置並附到 Release。
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定 SUPABASE_URL、SUPABASE_ANON_KEY、GOOGLE_WEB_CLIENT_ID。
name: Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04（glibc 2.35）建出來的在 22.04 以後的發行版都能跑，和 docker/linux.Dockerfile 相同
          - { arch: x64, runner: ubuntu-22.04, appimage: x86_64 }
          - { arch: arm64, runner: ubuntu-22.04-arm, appimage: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGETOOL_VERSION: '1.9.1'
      APPIMAGE_RUNTIME_VERSION: '20251108'
    steps:
      - uses: actions/checkout@v4

      - name: 安裝建置工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config make rsync file \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev \
            dpkg-dev patchelf imagemagick desktop-file-utils

      - name: 安裝 appimagetool
        run: |
          cd /opt
          sudo curl -fsSL -o appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${{ matrix.appimage }}.AppImage"
          sudo chmod +x appimagetool.AppImage
          sudo ./appimagetool.AppImage --appimage-extract >/dev/null
          sudo mv squashfs-root appimagetool && sudo rm appimagetool.AppImage
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          sudo curl -fsSL -o /opt/appimage-runtime "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${{ matrix.appimage }}"
          echo "APPIMAGE_RUNTIME=/opt/appimage-runtime" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 產生 env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" --arg google "$GOOGLE_WEB_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, SECURIBIT_WEB_URL: "https://2fa.bityo.tw", GOOGLE_WEB_CLIENT_ID: $google, GOOGLE_IOS_CLIENT_ID: ""}' > env.json

      - name: 建置 .tar.gz、.deb、AppImage
        run: make linux-all

      # 在乾淨的 Ubuntu／Debian 容器裡安裝 .deb、執行 AppImage（在 GitHub 的主機上跑，不是你的電腦）
      - name: 安裝檢查
        run: make deb-check appimage-check

      - uses: actions/upload-artifact@v4
        with:
          name: securibit-linux-${{ matrix.arch }}
          path: dist/*

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
