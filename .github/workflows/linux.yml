# Linux 版在 GitHub 的 Linux 主機上直接建置（不用 Docker）：x64 與 arm64 各一台，產出 .tar.gz、.deb。
# 手動執行（Actions → Linux → Run workflow），或 push v* 標籤時建置並附到 Release。
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定 SUPABASE_URL、SUPABASE_ANON_KEY、GOOGLE_WEB_CLIENT_ID。
name: Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04（glibc 2.35）建出來的在 22.04 以後的發行版都能跑，和 docker/linux.Dockerfile 相同
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # 和使用者自己編譯時的 make linux-deps 相同：apt 安裝系統套件，並確認 Flutter、Rust 都在
      - name: 安裝建置工具
        run: make linux-deps

      - name: 產生 env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" --arg google "$GOOGLE_WEB_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, SECURIBIT_WEB_URL: "https://2fa.bityo.tw", GOOGLE_WEB_CLIENT_ID: $google, GOOGLE_IOS_CLIENT_ID: ""}' > env.json

      # runner 上有 flutter、cargo、rustup，make 會自動直接建置（不用 Docker）；
      # 在 Ubuntu 22.04 上建，檔名不帶發行版
      - name: 建置 .tar.gz、.deb
        run: make linux-all

      # 在乾淨的 Ubuntu／Debian 容器裡安裝 .deb（在 GitHub 的主機上跑，不是你的電腦）
      - name: 安裝檢查
        run: make deb-check

      - uses: actions/upload-artifact@v4
        with:
          name: securibit-linux-${{ matrix.arch }}
          path: dist/*

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
